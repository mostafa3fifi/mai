<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Setup Choices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff2;
  --paper:#ffffff;
  --ink:#1a2530;
  --muted:#5d6b78;
  --line:#d3dae1;
  --primary:#1d4e89;
  --primary-ink:#ffffff;
  --primary-soft:#e2ecf8;
  --copper:#a8531f;
  --copper-soft:#f7e6da;
  --ok:#1f7a4d;
  --shadow:0 -1px 0 rgba(0,0,0,.04);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161c;
    --paper:#18212a;
    --ink:#e8edf1;
    --muted:#9aa8b5;
    --line:#2c3947;
    --primary:#6aa5ee;
    --primary-ink:#0c1620;
    --primary-soft:#1e2f45;
    --copper:#e39a6a;
    --copper-soft:#3a2618;
    --ok:#5fc793;
  }
}
:root[data-theme="dark"]{
  --bg:#10161c;
  --paper:#18212a;
  --ink:#e8edf1;
  --muted:#9aa8b5;
  --line:#2c3947;
  --primary:#6aa5ee;
  --primary-ink:#0c1620;
  --primary-soft:#1e2f45;
  --copper:#e39a6a;
  --copper-soft:#3a2618;
  --ok:#5fc793;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);}
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,'Noto Naskh Arabic',Arial,sans-serif;
  font-size:16px;
  line-height:1.7;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;}

/* ---------- brand / logo ---------- */
.brandhead{
  background:#10161c;border-bottom:1px solid #2c3947;
  padding:26px 16px 20px;text-align:center;
}
.brandhead-inner{max-width:860px;margin:0 auto;display:flex;justify-content:center;}
.logo-card{display:inline-block;background:transparent;}
.logo-img{display:block;width:clamp(180px,42vw,280px);height:auto;}

/* ---------- top bar ---------- */
.bar{
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:20;
  background:var(--ink);
  color:var(--bg);
}
.bar-inner{max-width:860px;margin:0 auto;padding:10px 16px 0;}
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px;direction:ltr;unicode-bidi:isolate;}
.count{font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;}
.status{background:none;border:0;padding:0;font-size:13px;color:inherit;opacity:.85;font-family:inherit;}
.status[data-s="saved"]{color:#9be3b8;}
.status[data-s="error"]{color:#ffb4a2;text-decoration:underline;opacity:1;}
main.busy #root,main.busy .meta,main.busy .summary{pointer-events:none;opacity:.55;}
.track{height:4px;background:rgba(255,255,255,.22);margin-top:8px;}
.fill{height:100%;width:0;background:#f0a468;transition:width .25s ease;}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 0 9px;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav button{
  flex:0 0 auto;background:transparent;border:1px solid rgba(255,255,255,.3);
  color:inherit;padding:2px 12px;font-size:13.5px;border-radius:4px;
}
.nav button:hover{background:rgba(255,255,255,.12);}
.nav button small{opacity:.8;margin-inline-start:6px;font-size:12px;font-variant-numeric:tabular-nums;}
.nav button[aria-selected="true"]{background:#f0a468;border-color:#f0a468;color:#1a2530;font-weight:600;}
.nav button[aria-selected="true"]:hover{background:#f0a468;}
.pager{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:14px 18px;border-top:1px solid var(--line);background:var(--bg);}
.pager .next{margin-inline-start:auto;}
.nav button:focus-visible{outline-color:#f0a468;}

/* ---------- page ---------- */
main{max-width:860px;margin:0 auto;padding:22px 16px 60px;}
.intro h1{font-size:clamp(24px,5.4vw,34px);line-height:1.35;margin:6px 0 6px;font-weight:700;}
.intro p{margin:0;color:var(--muted);max-width:60ch;}
.help-legend{display:inline-flex;align-items:center;gap:6px;}

.meta{
  margin:22px 0 8px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;
}
.field label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:2px;}
.field input{
  width:100%;background:var(--paper);color:var(--ink);border:0;border-bottom:2px solid var(--line);
  padding:8px 10px;font:inherit;border-radius:0;
}
.field input:focus{outline:none;border-bottom-color:var(--primary);}

section.block{margin-top:34px;background:var(--paper);border-top:4px solid var(--ink);box-shadow:var(--shadow);}
section.block > h2{
  margin:0;padding:14px 18px;font-size:20px;font-weight:700;border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
section.block > h2 small{font-weight:400;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.group-h{
  margin:0;padding:8px 18px;font-size:14px;font-weight:600;color:var(--primary);
  background:var(--primary-soft);
}

.row{padding:14px 18px;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:0;}
.row-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:9px;}
.row-head .lbl{font-weight:600;}
.row.done .lbl::after{content:"✓";color:var(--ok);margin-inline-start:8px;font-weight:700;}
.qbtn{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--primary);color:var(--primary);
  background:transparent;font-weight:700;font-size:15px;line-height:1;padding:0;display:inline-grid;place-items:center;
}
.qbtn:hover{background:var(--primary);color:var(--primary-ink);}
.notebtn{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--copper);color:var(--copper);
  background:transparent;font-weight:700;font-size:13px;line-height:1;padding:0;display:inline-grid;place-items:center;
}
.notebtn:hover{background:var(--copper);color:#fff;}
.notebtn.has-note{background:var(--copper);color:#fff;}
.noteWrap{margin-top:10px;}
.noteWrap textarea{
  width:100%;min-height:64px;resize:vertical;background:var(--paper);color:var(--ink);
  border:1.5px solid var(--copper);border-radius:6px;padding:8px 10px;font:inherit;font-size:14.5px;
}
.noteWrap textarea:focus{outline:none;border-color:var(--primary);}
.sum-note{font-size:13.5px;color:var(--copper);padding:2px 0 6px;border-bottom:1px dotted var(--line);}
.tag{
  font-size:12.5px;background:var(--copper-soft);color:var(--copper);
  padding:0 8px;border-radius:3px;font-weight:500;
}
.opts{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:var(--paper);border:1.5px solid var(--line);border-radius:6px;
  padding:6px 14px;min-height:40px;transition:background .12s,border-color .12s;
}
.chip:hover{border-color:var(--primary);}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600;}
.sub{
  margin-top:10px;padding:8px 12px;border-inline-start:3px solid var(--copper);background:var(--copper-soft);
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
}
.sub span{font-size:14px;color:var(--copper);font-weight:600;}
.sub .chip{min-height:34px;padding:2px 12px;}
.hint{font-size:13px;color:var(--muted);margin-top:6px;}

.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;}
.stepper button{width:42px;height:42px;border:0;background:var(--bg);font-size:20px;font-weight:600;}
.stepper button:hover{background:var(--primary-soft);}
.stepper output{min-width:56px;text-align:center;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;}

/* ---------- summary ---------- */
.summary{margin-top:40px;background:var(--paper);border:2px solid var(--ink);}
.summary header{
  padding:14px 18px;background:var(--ink);color:var(--bg);display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;
}
.summary header h2{margin:0;font-size:20px;}
.summary header span{font-size:13.5px;opacity:.85;}
.sum-body{padding:6px 18px 14px;}
.sum-sec{margin-top:14px;}
.sum-sec h3{margin:0 0 4px;font-size:15px;color:var(--primary);border-bottom:1px solid var(--line);padding-bottom:2px;}
.sum-line{display:flex;justify-content:space-between;gap:16px;padding:3px 0;font-size:15px;border-bottom:1px dotted var(--line);}
.sum-line b{font-weight:600;}
.sum-line em{font-style:normal;text-align:end;}
.sum-line.empty em{color:var(--muted);}
.actions{display:flex;flex-wrap:wrap;gap:10px;padding:14px 18px 18px;border-top:1px solid var(--line);}
.btn{padding:9px 20px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;font-weight:600;}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{border-color:var(--line);color:var(--muted);margin-inline-start:auto;}

/* ---------- help dialog ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(10,16,22,.55);display:none;
  align-items:center;justify-content:center;padding:16px;
}
.overlay.open{display:flex;}
.dialog{
  background:var(--paper);color:var(--ink);width:min(560px,100%);max-height:86vh;overflow:auto;
  border-top:5px solid var(--copper);padding:18px 20px 20px;
}
.dialog h3{margin:0 0 10px;font-size:20px;}
.dialog dl{margin:0;}
.dialog dt{font-weight:700;color:var(--primary);margin-top:12px;}
.dialog dd{margin:2px 0 0;}
.dialog .note{margin-top:14px;padding:8px 12px;background:var(--copper-soft);color:var(--copper);font-size:14.5px;}
.dialog .close{margin-top:16px;width:100%;}
@media (max-width:560px){
  .overlay{align-items:flex-end;padding:0;}
  .dialog{width:100%;border-radius:12px 12px 0 0;max-height:80vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}
}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:6px;font-size:14.5px;z-index:60;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1;}

@media (prefers-reduced-motion:reduce){*{transition:none !important;}}

@page{size:A4;margin:0;}
@media print{
  html,body{margin:0;}
  body{padding:12mm 12mm;}
  .brandhead{background:#fff !important;border-bottom:1px solid #ccc !important;}
  .logo-img{filter:invert(1);}
  .bar,.qbtn,.actions,.nav,.toast,.overlay,.pager{display:none !important;}
  section.block[hidden],.summary[hidden]{display:block !important;}
  body{background:#fff;color:#000;}
  section.block{break-inside:avoid;}
  .summary{break-before:page;}
}

/* ---------- وضع الاستضافة داخل الموقع ---------- */
body.host .brandhead{padding:14px 16px 12px;}
body.host .logo-img{width:clamp(110px,26vw,160px);}
.field input[readonly]{background:var(--primary-soft);cursor:default;}
body.ro .chip,body.ro .stepper button{cursor:not-allowed;}
body.ro .chip[aria-pressed="false"]{opacity:.55;}
body.ro .stepper button{opacity:.4;}
body.ro .notebtn:not(.has-note){display:none;}
</style>
</head>

  var TABS = SECTIONS.map(function(s){ return {id:s.id, nav:s.nav}; }).concat([{id:'summary', nav:'الملخص'}]);
  function panelId(id){ return id==='summary' ? 'summary' : 'sec-'+id; }
  function tabIndex(id){ for(var i=0;i<TABS.length;i++){ if(TABS[i].id===id) return i; } return 0; }

  var CFG = (function(){
    var c = window.AFIFI_FORM_CONFIG || {}, q = '';
    try{ q = new URLSearchParams(location.search).get('project') || ''; }catch(e){}
    return {
      apiUrl: c.apiUrl || '',
      projectId: String(c.projectId || q || ''),
      headers: c.headers || {},
      method: c.method || 'POST',
      credentials: c.credentials || 'same-origin',
      debounce: c.debounce || 800
    };
  })();
  var REMOTE = !!(CFG.apiUrl && CFG.projectId);
  var KEY = 'afifi-selections-v1' + (CFG.projectId ? ':' + CFG.projectId : '');

  /* ===== وضع الاستضافة داخل الموقع (HOST): البيانات تأتي من الصفحة الأم عبر postMessage ===== */
  var HOST = (window.parent && window.parent !== window);
  var RO = HOST;            /* للقراءة فقط حتى تصل بيانات المشروع */
  var hostReady = false;
  var state = {meta:{},a:{}};
  function adopt(p){ state = {meta:(p && p.meta) || {}, a:(p && p.a) || {}, tab:(p && p.tab) || undefined}; }
  if(!HOST) try{
    var raw = localStorage.getItem(KEY);
    if(raw){ var p0 = JSON.parse(raw); if(p0 && p0.a) adopt(p0); }
  }catch(e){}
  function pickTab(){ return (state.tab && TABS.some(function(t){ return t.id===state.tab; })) ? state.tab : TABS[0].id; }
  var activeTab = pickTab();

  /* في وضع السيرفر: لا يُسمح بالحفظ قبل نجاح تحميل الاختيارات المحفوظة، حتى لا نمسحها بالخطأ */
  var canSave = !REMOTE;
  var statusEl = null, pushTimer = null, pending = false;

  function saveLocal(){ if(HOST) return; try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function save(){ saveLocal(); if(REMOTE) scheduleRemote(); if(HOST) pushHost(); }

  function postHost(type, extra){
    try{ var m = {type:type}; for(var k in (extra||{})) m[k] = extra[k]; window.parent.postMessage(m, '*'); }catch(e){}
  }
  function pushHost(){
    if(RO || !hostReady) return;
    var done = 0; SECTIONS.forEach(function(s){ s.items.forEach(function(it){ if(isDone(it)) done++; }); });
    postHost('afifi-change', {a: JSON.parse(JSON.stringify(state.a)), done: done, total: total});
  }
  function applyRO(){
    document.body.classList.toggle('ro', RO);
    document.querySelectorAll('[data-meta]').forEach(function(el){ el.readOnly = true; if(!el.value) el.placeholder = '—'; });
    document.querySelectorAll('textarea[data-note]').forEach(function(t){ t.readOnly = RO; });
    var r = document.getElementById('btn-reset'); if(r) r.style.display = RO ? 'none' : '';
  }

  function endpoint(){
    return CFG.apiUrl + (CFG.apiUrl.indexOf('?')>-1 ? '&' : '?') + 'project=' + encodeURIComponent(CFG.projectId);
  }
  function setStatus(kind){
    if(!REMOTE) return;
    statusEl = statusEl || document.getElementById('status');
    var T = {
      loading:'جارٍ تحميل اختياراتك…',
      saving:'جارٍ الحفظ…',
      saved:'تم الحفظ',
      error:'تعذر الحفظ، اضغط لإعادة المحاولة',
      loaderror:'تعذر تحميل اختياراتك المحفوظة، اضغط لإعادة المحاولة'
    };
    statusEl.hidden = false;
    statusEl.dataset.k = kind;
    statusEl.dataset.s = (kind==='loaderror') ? 'error' : kind;
    statusEl.textContent = T[kind];
    var main = document.querySelector('main');
    if(main) main.classList.toggle('busy', kind==='loading' || kind==='loaderror');
  }
  function scheduleRemote(){
    if(!canSave) return;
    pending = true; setStatus('saving');
    clearTimeout(pushTimer); pushTimer = setTimeout(pushRemote, CFG.debounce);
  }
  function pushRemote(){
    if(!canSave) return;
    clearTimeout(pushTimer); pending = false; setStatus('saving');
    var body = JSON.stringify({project:CFG.projectId, meta:state.meta, a:state.a, tab:state.tab || null, updatedAt:new Date().toISOString()});
    fetch(endpoint(), {
      method:CFG.method,
      headers:Object.assign({'Content-Type':'application/json'}, CFG.headers),
      credentials:CFG.credentials,
      body:body,
      keepalive: body.length < 60000
    }).then(function(r){
      if(!r.ok) throw new Error(String(r.status));
      if(!pending) setStatus('saved');
    }).catch(function(){ setStatus('error'); });
  }
  function loadRemote(){
    setStatus('loading');
    fetch(endpoint(), {
      method:'GET',
      headers:Object.assign({'Accept':'application/json'}, CFG.headers),
      credentials:CFG.credentials
    }).then(function(r){
      if(r.status===404 || r.status===204) return null;   /* مشروع جديد بلا اختيارات محفوظة */
      if(!r.ok) throw new Error(String(r.status));
      return r.json();
    }).then(function(j){
      if(j && (j.a || j.meta)){ adopt(j); saveLocal(); activeTab = pickTab(); }
      canSave = true;
      render();
      setStatus('saved');
    }).catch(function(){ setStatus('loaderror'); });
  }

  var byId = {}; var total = 0;
  SECTIONS.forEach(function(s){ s.items.forEach(function(it){ byId[it.id] = it; total++; }); });

  function getOpt(it, v){ for(var i=0;i<it.opts.length;i++){ if(it.opts[i].v===v) return it.opts[i]; } return null; }
  function isDone(it){
    var v = state.a[it.id];
    if(it.number) return typeof v === 'number';
    if(it.multi) return Array.isArray(v) && v.length>0;
    return !!v;
  }

  function chipHtml(it, o){
    var cur = state.a[it.id];
    var on = it.multi ? (Array.isArray(cur) && cur.indexOf(o.v)>-1) : cur===o.v;
    return '<button type="button" class="chip" data-item="'+it.id+'" data-v="'+o.v+'" aria-pressed="'+on+'">'+o.l+'</button>';
  }
  function subHtml(it){
    var cur = state.a[it.id]; var out = '';
    var vals = it.multi ? (cur||[]) : (cur?[cur]:[]);
    vals.forEach(function(v){
      var o = getOpt(it,v);
      if(o && o.sub){
        var sv = state.a[it.id+'_sub'];
        out += '<div class="sub"><span>'+o.sub.label+':</span>'+o.sub.opts.map(function(so){
          return '<button type="button" class="chip" data-sub="'+it.id+'" data-v="'+so.v+'" aria-pressed="'+(sv===so.v)+'">'+so.l+'</button>';
        }).join('')+'</div>';
      }
    });
    return out;
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'})[c];
    });
  }
  function rowInner(it){
    var noteVal = state.a[it.id+'_note'] || '';
    var head = '<div class="row-head"><span class="lbl">'+it.label+'</span>';
    if(it.help) head += '<button type="button" class="qbtn" data-help="'+it.help+'" aria-label="شرح: '+it.label+'">؟</button>';
    head += '<button type="button" class="notebtn'+(noteVal.trim()?' has-note':'')+'" data-note-toggle="'+it.id+'" aria-label="ملاحظة على: '+it.label+'" title="اكتب ملاحظة أو تفضيل خاص بهذا الاختيار">✎</button>';
    if(it.early) head += '<span class="tag">'+it.early+'</span>';
    head += '</div>';
    var body;
    if(it.number){
      var n = typeof state.a[it.id]==='number' ? state.a[it.id] : 0;
      body = '<div class="stepper"><button type="button" data-step="-1" data-item="'+it.id+'" aria-label="إنقاص">−</button><output>'+n+'</output><button type="button" data-step="1" data-item="'+it.id+'" aria-label="زيادة">+</button></div>';
      if(typeof state.a[it.id] !== 'number') body += '<div class="hint">اضغط + لتحديد العدد، وصفر يعني لا يوجد.</div>';
    } else {
      body = '<div class="opts">'+it.opts.map(function(o){return chipHtml(it,o);}).join('')+'</div>'+subHtml(it);
      if(it.hint) body += '<div class="hint">'+it.hint+'</div>';
    }
    body += '<div class="noteWrap" data-note-wrap="'+it.id+'"'+(noteVal.trim()?'':' hidden')+'>'
      + '<textarea data-note="'+it.id+'" placeholder="اكتب أي تفضيل أو ملاحظة خاصة بهذا الاختيار...">'+escapeHtml(noteVal)+'</textarea>'
      + '</div>';
    return head+body;
  }
  function rowHtml(it){
    return '<div class="row'+(isDone(it)?' done':'')+'" id="row-'+it.id+'">'+rowInner(it)+'</div>';
  }

  function render(){
    var html = '';
    SECTIONS.forEach(function(s){
      var lastGroup = null;
      html += '<section class="block" id="sec-'+s.id+'"'+(s.id===activeTab?'':' hidden')+'><h2>'+s.title+'<small data-sc="'+s.id+'"></small></h2>';
      s.items.forEach(function(it){
        if(it.group && it.group!==lastGroup){ html += '<h3 class="group-h">'+it.group+'</h3>'; lastGroup = it.group; }
        html += rowHtml(it);
      });
      var ti = tabIndex(s.id), prev = TABS[ti-1], next = TABS[ti+1];
      html += '<div class="pager">'
        + (prev ? '<button type="button" class="btn" data-tab="'+prev.id+'" data-scroll="1">السابق: '+prev.nav+'</button>' : '')
        + (next ? '<button type="button" class="btn primary next" data-tab="'+next.id+'" data-scroll="1">التالي: '+next.nav+'</button>' : '')
        + '</div></section>';
    });
    document.getElementById('root').innerHTML = html;
    var nav = document.getElementById('nav');
    nav.setAttribute('role','tablist');
    nav.innerHTML = TABS.map(function(t){
      return '<button type="button" role="tab" data-tab="'+t.id+'" aria-selected="'+(t.id===activeTab)+'">'+t.nav
        + (t.id==='summary' ? '' : '<small data-tc="'+t.id+'"></small>')+'</button>';
    }).join('');
    document.querySelectorAll('[data-meta]').forEach(function(el){ el.value = state.meta[el.getAttribute('data-meta')] || ''; });
    refreshStats(); renderSummary(); showTab(activeTab, false);
  }

  function showTab(id, scroll){
    activeTab = id; state.tab = id; saveLocal(); if(HOST) postHost('afifi-tab', {tab:id});
    TABS.forEach(function(t){
      var pnl = document.getElementById(panelId(t.id));
      if(pnl) pnl.hidden = (t.id!==id);
    });
    document.querySelectorAll('#nav [data-tab]').forEach(function(b){
      var on = b.dataset.tab===id;
      b.setAttribute('aria-selected', on);
      if(on){ try{ b.scrollIntoView({inline:'center', block:'nearest'}); }catch(e){} }
    });
    if(scroll){
      var pnl = document.getElementById(panelId(id));
      if(pnl) pnl.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth', block:'start'});
    }
  }

  function refreshStats(){
    var done = 0;
    SECTIONS.forEach(function(s){
      var d = 0; s.items.forEach(function(it){ if(isDone(it)) d++; });
      done += d;
      var el = document.querySelector('[data-sc="'+s.id+'"]');
      if(el) el.textContent = d+' / '+s.items.length;
      var tc = document.querySelector('[data-tc="'+s.id+'"]');
      if(tc) tc.textContent = d+'/'+s.items.length;
    });
    document.getElementById('count').textContent = done+' من '+total+' بنداً';
    document.getElementById('fill').style.width = (done/total*100)+'%';
    if(HOST) postHost('afifi-progress', {done: done, total: total});
  }

  function valueText(it){
    var v = state.a[it.id];
    if(it.number) return typeof v==='number' ? (v===0?'لا يوجد':String(v)) : null;
    if(!isDone(it)) return null;
    var vals = it.multi ? v : [v];
    return vals.map(function(x){
      var o = getOpt(it,x); var t = o ? o.l : x;
      if(o && o.sub){
        var sv = state.a[it.id+'_sub'];
        if(sv){ var so = null; o.sub.opts.forEach(function(q){ if(q.v===sv) so = q; }); if(so) t += ' ('+so.l+')'; }
      }
      return t;
    }).join('، ');
  }

  function renderSummary(){
    var html = ''; var open = 0;
    SECTIONS.forEach(function(s){
      html += '<div class="sum-sec"><h3>'+s.title+'</h3>';
      s.items.forEach(function(it){
        var t = valueText(it);
        var name = it.group ? it.group+' — '+it.label : it.label;
        if(t===null) open++;
        html += '<div class="sum-line'+(t===null?' empty':'')+'"><b>'+name+'</b><em>'+(t===null?'لم يُحدد بعد':t)+'</em></div>';
        var note = state.a[it.id+'_note'];
        if(note && note.trim()) html += '<div class="sum-note">ملاحظة: '+escapeHtml(note)+'</div>';
      });
      html += '</div>';
    });
    document.getElementById('sum-body').innerHTML = html;
    document.getElementById('sum-date').textContent = open ? ('متبقي '+open+' بنداً') : 'تم تحديد كل البنود';
  }

  function summaryText(){
    var L = ['Project Setup Choices'];
    var m = state.meta;
    if(m.name) L.push('العميل: '+m.name);
    if(m.unit) L.push('الوحدة: '+m.unit);
    if(m.phone) L.push('الهاتف: '+m.phone);
    SECTIONS.forEach(function(s){
      L.push(''); L.push('■ '+s.title);
      s.items.forEach(function(it){
        var t = valueText(it);
        var name = it.group ? it.group+' - '+it.label : it.label;
        L.push('- '+name+': '+(t===null?'لم يُحدد':t));
        var note = state.a[it.id+'_note'];
        if(note && note.trim()) L.push('  ملاحظة: '+note.trim());
      });
    });
    return L.join('\n');
  }

  function toast(msg){
    var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function updateRow(id, focusSel){
    var it = byId[id]; var row = document.getElementById('row-'+id);
    if(!row) return;
    row.className = 'row'+(isDone(it)?' done':'');
    row.innerHTML = rowInner(it);
    if(focusSel){ var f = row.querySelector(focusSel); if(f) f.focus(); }
    refreshStats(); renderSummary(); save();
  }

  /* ---------- help dialog ---------- */
  var overlay = document.getElementById('overlay'), dialog = document.getElementById('dialog'), lastFocus = null;
  function openHelp(key, trigger){
    var h = HELP[key]; if(!h) return;
    lastFocus = trigger;
    var html = '<h3 id="dlg-title">'+h.title+'</h3><dl>';
    h.items.forEach(function(p){ html += '<dt>'+p[0]+'</dt><dd>'+p[1]+'</dd>'; });
    html += '</dl>';
    if(h.note) html += '<div class="note">ملاحظة: '+h.note+'</div>';
    html += '<button type="button" class="btn primary close" id="dlg-close">تم</button>';
    dialog.innerHTML = html;
    overlay.classList.add('open');
    document.getElementById('dlg-close').focus();
  }
  function closeHelp(){
    overlay.classList.remove('open');
    if(lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
  }
  overlay.addEventListener('click', function(e){ if(e.target===overlay || e.target.id==='dlg-close') closeHelp(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && overlay.classList.contains('open')) closeHelp(); });

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;

    if(b.dataset.help){ openHelp(b.dataset.help, b); return; }

    if(b.dataset.noteToggle){
      var nid = b.dataset.noteToggle;
      var wrap = document.querySelector('[data-note-wrap="'+nid+'"]');
      if(wrap){
        wrap.hidden = !wrap.hidden;
        if(!wrap.hidden){ var ta = wrap.querySelector('textarea'); if(ta) ta.focus(); }
      }
      return;
    }

    if(b.dataset.tab){ showTab(b.dataset.tab, b.dataset.scroll==='1' || !!b.closest('#nav')); return; }

    if(RO && (b.dataset.step || b.dataset.sub || (b.dataset.item && b.dataset.v))) return;

    if(b.dataset.step){
      var it = byId[b.dataset.item];
      var cur = typeof state.a[it.id]==='number' ? state.a[it.id] : 0;
      state.a[it.id] = Math.max(0, Math.min(30, cur + parseInt(b.dataset.step,10)));
      updateRow(it.id, '[data-step="'+b.dataset.step+'"]');
      return;
    }

    if(b.dataset.sub){
      var id = b.dataset.sub;
      state.a[id+'_sub'] = (state.a[id+'_sub']===b.dataset.v) ? null : b.dataset.v;
      updateRow(id, '[data-sub="'+id+'"][data-v="'+b.dataset.v+'"]');
      return;
    }

    if(b.dataset.item && b.dataset.v){
      var item = byId[b.dataset.item], v = b.dataset.v, o = getOpt(item, v);
      if(item.multi){
        var arr = Array.isArray(state.a[item.id]) ? state.a[item.id].slice() : [];
        var i = arr.indexOf(v);
        if(i>-1){ arr.splice(i,1); }
        else {
          if(o && o.exclusive){ arr = [v]; }
          else { arr = arr.filter(function(x){ var q = getOpt(item,x); return !(q && q.exclusive); }); arr.push(v); }
        }
        state.a[item.id] = arr;
      } else {
        state.a[item.id] = (state.a[item.id]===v) ? null : v;
      }
      // drop stale sub answers
      var sel = item.multi ? (state.a[item.id]||[]) : (state.a[item.id]?[state.a[item.id]]:[]);
      var hasSub = sel.some(function(x){ var q = getOpt(item,x); return q && q.sub; });
      if(!hasSub) delete state.a[item.id+'_sub'];
      updateRow(item.id, '[data-item="'+item.id+'"][data-v="'+v+'"]');
      return;
    }
  });

  document.addEventListener('input', function(e){
    if(RO) return;
    var k = e.target.getAttribute && e.target.getAttribute('data-meta');
    if(k){ state.meta[k] = e.target.value; save(); return; }
    var nid = e.target.getAttribute && e.target.getAttribute('data-note');
    if(nid){
      state.a[nid+'_note'] = e.target.value;
      save();
      var btn = document.querySelector('[data-note-toggle="'+nid+'"]');
      if(btn) btn.classList.toggle('has-note', !!e.target.value.trim());
      renderSummary();
    }
  });

  document.getElementById('btn-copy').addEventListener('click', function(){
    var text = summaryText();
    function fallback(){
      var ta = document.createElement('textarea'); ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      toast(ok ? 'تم نسخ الملخص' : 'تعذر النسخ، حدد النص من الملخص يدوياً');
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){ toast('تم نسخ الملخص'); }, fallback);
      } else fallback();
    }catch(e){ fallback(); }
  });
  document.getElementById('btn-print').addEventListener('click', function(){
    try{ window.print(); }catch(e){ toast('الطباعة غير متاحة هنا، استخدم زر نسخ الملخص'); }
  });
  var resetArmed = false, resetTimer = null;
  document.getElementById('btn-reset').addEventListener('click', function(){
    var btn = this;
    if(!resetArmed){
      resetArmed = true; btn.textContent = 'اضغط مرة أخرى للتأكيد';
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function(){ resetArmed = false; btn.textContent = 'مسح كل الاختيارات'; }, 4000);
      return;
    }
    resetArmed = false; btn.textContent = 'مسح كل الاختيارات';
    state = {meta:(HOST ? state.meta : {}), a:{}, tab:state.tab}; save();
    if(!HOST) document.querySelectorAll('[data-meta]').forEach(function(el){ el.value=''; });
    render(); window.scrollTo(0,0); toast('تم مسح كل الاختيارات');
  });

  document.getElementById('sum-date').textContent = '';
  render();

  if(HOST){
    document.body.classList.add('host');
    applyRO();
    window.addEventListener('message', function(e){
      if(e.source !== window.parent) return;
      var m = e.data; if(!m || typeof m !== 'object') return;
      if(m.type === 'afifi-init'){
        state = {meta: m.meta || {}, a: m.a || {}, tab: m.tab};
        RO = !!m.readonly; hostReady = true;
        activeTab = pickTab();
        render(); applyRO();
      }
    });
    postHost('afifi-ready');
  }

  if(REMOTE){
    var note = document.getElementById('save-note');
    if(note) note.textContent = 'الاختيارات تُحفظ تلقائياً في ملف مشروعك على الموقع.';
    document.getElementById('status').addEventListener('click', function(){
      var k = this.dataset.k;
      if(k==='loaderror') loadRemote(); else if(k==='error') pushRemote();
    });
    document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden' && pending) pushRemote(); });
    window.addEventListener('pagehide', function(){ if(pending) pushRemote(); });
    loadRemote();
  }
})();
</script>
</body>
</html>
